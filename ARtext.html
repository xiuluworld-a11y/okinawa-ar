<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>玉泉洞クエスト：ARエンジン</title>
<style>
body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
#webcam, #ar-canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; }
#ar-canvas { z-index: 10; pointer-events: none; }

/* クイズUIエリア */
#quiz-ui {
    position: fixed;
    bottom: -100vh;
    left: 0;
    width: 100vw;
    height: 42vh;
    background: rgba(0, 0, 0, 0.85);
    border-top: 3px solid #00FF00;
    border-radius: 20px 20px 0 0;
    z-index: 100;
    transition: bottom 0.4s ease;
    padding: 20px;
    box-sizing: border-box;
    color: #fff;
    text-align: center;
}
#quiz-ui.show { bottom: 0; }

.quiz-text { font-size: 16px; font-weight: bold; margin-bottom: 12px; color: #00FF00; }
.hint-text { font-size: 16px; color: #FFF; font-weight: bold; line-height: 1.5; }

/* 3択ボタン */
.options-container { display: flex; flex-direction: column; gap: 8px; }
.option-btn {
    background: #222;
    color: #fff;
    border: 1px solid #00FF00;
    padding: 10px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
}
.option-btn:active { background: #00FF00; color: #000; }

.next-btn {
    background: #00FF00;
    color: #000;
    border: none;
    padding: 12px 30px;
    border-radius: 25px;
    font-size: 16px;
    font-weight: bold;
    margin-top: 15px;
}
</style>
</head>
<body>

<video id="webcam" autoplay playsinline muted></video>
<canvas id="ar-canvas"></canvas>

<div id="quiz-ui">
    <div id="ui-content"></div>
</div>

<script>
const video = document.getElementById('webcam');
const canvas = document.getElementById('ar-canvas');
const ctx = canvas.getContext('2d');
const quizUi = document.getElementById('quiz-ui');
const uiContent = document.getElementById('ui-content');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ==========================================
// 【クエストデータ設定】
// ==========================================
let currentStage = 0;

const questData = [
    {
        location: "A地点（玉泉洞 入口）",
        imageSrc: "cave_quest_A.png",
        question: "【第1問】玉泉洞の鍾乳石は、何年で1センチ伸びると言われている？",
        options: ["約3年", "約30年", "約300年"],
        correctIndex: 1,
        hint: "正解！国内最速のスピードです！<br>【B地点へのヒント】次は『青の泉』の看板の近くにあるマーカーを探せ！"
    },
    {
        location: "B地点（青の泉）",
        imageSrc: "cave_quest_B.png",
        question: "【第2問】鍾乳洞のなかの気温は、年間を通して約何度で一定？",
        options: ["約15度", "約21度", "約28度"],
        correctIndex: 1,
        hint: "素晴らしい！全問正解です！<br>洞窟を出て、お土産ショップの受付で景品をもらおう！"
    }
];

// カメラ起動
navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
.then((stream) => {
    video.srcObject = stream;
    video.addEventListener('loadedmetadata', () => {
        requestAnimationFrame(analyzeFrame);
    });
})
.catch((err) => { alert("カメラエラー: " + err.name); });

// 変数
let isFound = false;
let savedX = 0, savedY = 0;
let imgScale = 1.0;
let offsetX = 0, offsetY = 0;
let touchStartDist = 0;

// AR表示用の画像オブジェクト
const arImage = new Image();

// 画像解析ループ
function analyzeFrame() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (isFound) {
        // 画面の「完全な中心」に固定して描画
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        drawAR(centerX, centerY);
        
        requestAnimationFrame(analyzeFrame);
        return; 
    }

    const hiddenCanvas = document.createElement('canvas');
    hiddenCanvas.width = 160;
    hiddenCanvas.height = 120;
    const hCtx = hiddenCanvas.getContext('2d');
    hCtx.drawImage(video, 0, 0, hiddenCanvas.width, hiddenCanvas.height);

    try {
        const imgData = hCtx.getImageData(0, 0, hiddenCanvas.width, hiddenCanvas.height);
        const pixels = imgData.data;
        let corners = [];
        let threshold = 40;

        for (let y = 4; y < hiddenCanvas.height - 4; y += 3) {
            for (let x = 4; x < hiddenCanvas.width - 4; x += 3) {
                const idx = (y * hiddenCanvas.width + x) * 4;
                const current = (pixels[idx] + pixels[idx+1] + pixels[idx+2]) / 3;
                const idxRight = (y * hiddenCanvas.width + (x + 2)) * 4;
                const idxBottom = ((y + 2) * hiddenCanvas.width + x) * 4;
                const diffX = Math.abs(current - (pixels[idxRight] + pixels[idxRight+1] + pixels[idxRight+2]) / 3);
                const diffY = Math.abs(current - (pixels[idxBottom] + pixels[idxBottom+1] + pixels[idxBottom+2]) / 3);

                if (diffX > threshold && diffY > threshold) {
                    let isNew = true;
                    for (let c of corners) {
                        if (Math.abs(c.x - x) < 15 && Math.abs(c.y - y) < 15) {
                            isNew = false;
                            break;
                        }
                    }
                    if (isNew) corners.push({ x: x, y: y });
                }
            }
        }

        // 四隅に四角がある新しいマーカー対応（角が10個以上）
        if (corners.length >= 10) {
            let totalX = 0, totalY = 0;
            for (let c of corners) {
                totalX += c.x;
                totalY += c.y;
            }
            savedX = (totalX / corners.length) * (canvas.width / hiddenCanvas.width);
            savedY = (totalY / corners.length) * (canvas.height / hiddenCanvas.height);
            
            // 画像の読み込みを開始
            arImage.src = questData[currentStage].imageSrc;
            
            isFound = true; 
            showQuizUI();
        }
    } catch (e) {}

    requestAnimationFrame(analyzeFrame);
}

// AR描画
function drawAR(x, y) {
    ctx.save();

    // センター位置の計算（指の移動分をプラス）
    const currentX = x + offsetX;
    const currentY = y + offsetY;
    const imgWidth = 250 * imgScale;
    const imgHeight = 250 * imgScale;

    // 画像のロードが完了していれば描画する
    if (arImage.complete && arImage.naturalWidth !== 0) {
        ctx.drawImage(arImage, currentX - (imgWidth / 2), currentY - (imgHeight / 2), imgWidth, imgHeight);
    } else {
        // 画像がまだ読み込み中、またはファイル名間違いなどで読み込めない場合、代わりに緑の枠を出す（バグ発見用）
        ctx.strokeStyle = "#00FF00";
        ctx.lineWidth = 2;
        ctx.strokeRect(currentX - (imgWidth / 2), currentY - (imgHeight / 2), imgWidth, imgHeight);
    }

    ctx.restore();
}

// クイズUI表示
function showQuizUI() {
    if (currentStage >= questData.length) return;
    
    const stage = questData[currentStage];
    let optionsHtml = '';
    stage.options.forEach((opt, index) => {
        optionsHtml += `<button class="option-btn" onclick="checkAnswer(${index})">${opt}</button>`;
    });

    uiContent.innerHTML = `
        <div class="quiz-text">📍 ${stage.location}</div>
        <div class="quiz-text">${stage.question}</div>
        <div class="options-container">${optionsHtml}</div>
    `;
    quizUi.classList.add('show');
}

// 答え合わせ
function checkAnswer(selectedIndex) {
    const stage = questData[currentStage];
    
    if (selectedIndex === stage.correctIndex) {
        const isLast = currentStage === questData.length - 1;
        const btnText = isLast ? "クエストクリア！" : "次のスポットへ移動する";
        
        uiContent.innerHTML = `
            <div class="hint-text">${stage.hint}</div>
            <button class="next-btn" onclick="goToNextStage()">${btnText}</button>
        `;
    } else {
        alert("ザンネン！ちがうようだ。もう一度考えてみよう！");
    }
}

// 次のステージへ進む
function goToNextStage() {
    quizUi.classList.remove('show');
    
    // リセット
    isFound = false;
    offsetX = 0;
    offsetY = 0;
    imgScale = 1.0;
    
    currentStage++;
    
    if (currentStage >= questData.length) {
        alert("すべてのクエストが終了しました！");
    }
}

// タッチ操作（バグを完全に修正しました）
let startX = 0, startY = 0;
window.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
    } else if (e.touches.length === 2) {
        touchStartDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
        );
    }
});

window.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1) {
        const moveX = e.touches[0].clientX - startX;
        const moveY = e.touches[0].clientY - startY;
        offsetX += moveX;
        offsetY += moveY;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
    } else if (e.touches.length === 2) {
        const dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
        );
        imgScale *= (dist / touchStartDist);
        touchStartDist = dist;
    }
});
</script>
</body>
</html>
