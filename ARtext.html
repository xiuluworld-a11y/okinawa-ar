<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>玉泉洞クエスト：ARエンジン</title>
<style>
body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
#webcam, #ar-canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; }
#ar-canvas { z-index: 10; pointer-events: none; }

/* クイズUIエリア */
#quiz-ui {
position: fixed;
bottom: -100vh;
left: 0;
width: 100vw;
height: 42vh;
background: rgba(0, 0, 0, 0.85);
border-top: 3px solid #00FF00;
border-radius: 20px 20px 0 0;
z-index: 100;
transition: bottom 0.4s ease;
padding: 20px;
box-sizing: border-box;
color: #fff;
text-align: center;
/* 
  ★全体の基準サイズを500pxに固定し、
  画面幅が500pxより狭いとき（スマホ）は
  その画面幅に合わせて綺麗に全体を縮小します。
*/
#quiz {
  width: 500px; /* 基準の横幅を固定 */
  margin: auto;
  text-align: center;
  font-family: sans-serif;
  box-sizing: border-box;
  padding: 10px;
  overflow: hidden;
  
  /* 縮小の基準点を左上に設定 */
  transform-origin: top left; 
}
#quiz-ui.show { bottom: 0; }

.quiz-text { font-size: 16px; font-weight: bold; margin-bottom: 12px; color: #00FF00; }
.hint-text { font-size: 16px; color: #FFF; font-weight: bold; line-height: 1.5; }

/* 3択ボタン */
.options-container { display: flex; flex-direction: column; gap: 8px; }
.option-btn {
background: #222;
color: #fff;
border: 1px solid #00FF00;
padding: 10px;
border-radius: 8px;
font-size: 14px;
cursor: pointer;
}
.option-btn:active { background: #00FF00; color: #000; }

.next-btn {
background: #00FF00;
color: #000;
border: none;
padding: 12px 30px;
border-radius: 25px;
font-size: 16px;
font-weight: bold;
margin-top: 15px;
}
</style>
</head>
<body>

<video id="webcam" autoplay playsinline muted></video>
<canvas id="ar-canvas"></canvas>
/* すべての要素でサイズ計算を狂わせない設定 */
#quiz *, #quiz *::before, #quiz *::after {
  box-sizing: border-box;
}

<div id="quiz-ui">
<div id="ui-content"></div>
</div>
/* キーボードの外枠 */
.keyboard {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  margin: 20px auto;
  background: #e6e6fa; 
  padding: 8px;
  border-radius: 5px;
  width: 100%; 
}

<script>
const video = document.getElementById('webcam');
const canvas = document.getElementById('ar-canvas');
const ctx = canvas.getContext('2d');
const quizUi = document.getElementById('quiz-ui');
const uiContent = document.getElementById('ui-content');

function resizeCanvas() {
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
.key {
  border-radius: 6px;
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  pointer-events: none;
  user-select: none;
  box-shadow: 0 1px 1px rgba(0,0,0,0.2);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ==========================================
// 【クエストデータ設定】★セーブデータ読み込み対応
// ==========================================
let currentStage = parseInt(localStorage.getItem('cave_quest_stage')) || 0;

const questData = [
{
location: "A地点（玉泉洞 入口）",
        imageSrc: "cave_quest_A.png",
        imageSrc: "初恋広場.png",
question: "【第1問】玉泉洞の鍾乳石は、何年で1センチ伸びると言われている？",
options: ["約3年", "約30年", "約300年"],
correctIndex: 1,
hint: "正解！国内最速のスピードです！<br>【B地点へのヒント】次は『青の泉』の看板の近くにあるマーカーを探せ！"
},
{
location: "B地点（青の泉）",
        imageSrc: "cave_quest_B.png",
        imageSrc: "うなぎだーまんゆー_compressed.png",
question: "【第2問】鍾乳洞のなかの気温は、年間を通して約何度で一定？",
options: ["約15度", "約21度", "約28度"],
correctIndex: 1,
hint: "素晴らしい！全問正解です！<br>洞窟を出て、お土産ショップの受付で景品をもらおう！"

.key.white {
  background: #ffffff;
  color: #000000;
  font-size: 28px; /* 元の大きさに固定 */
}
];

// カメラ起動
navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
.then((stream) => {
video.srcObject = stream;
video.addEventListener('loadedmetadata', () => {
requestAnimationFrame(analyzeFrame);
});
})
.catch((err) => { alert("カメラエラー: " + err.name); });

// 変数
let isFound = false;
let savedX = 0, savedY = 0;
let imgScale = 1.0;
let offsetX = 0, offsetY = 0;
let touchStartDist = 0;

// AR表示用の画像オブジェクト
const arImage = new Image();

// 画像解析ループ
function analyzeFrame() {
ctx.clearRect(0, 0, canvas.width, canvas.height);

if (isFound) {
const centerX = canvas.width / 2;
const centerY = canvas.height / 2;
drawAR(centerX, centerY);

requestAnimationFrame(analyzeFrame);
return; 

.key.gray {
  background: #b0c4de;
  color: #000000;
  font-size: 24px; /* 元の大きさに固定 */
}

const hiddenCanvas = document.createElement('canvas');
hiddenCanvas.width = 160;
hiddenCanvas.height = 120;
const hCtx = hiddenCanvas.getContext('2d');
hCtx.drawImage(video, 0, 0, hiddenCanvas.width, hiddenCanvas.height);
/* ヒント1の枠 */
.key.Con {
  background: white;
  justify-content: flex-start;
  border: 1px solid #000000;
  color: red;
  width: 100%; 
  height: 25px; /* 元の高さに固定 */
  padding: 0 8px;
  font-size: 14px;
}

try {
const imgData = hCtx.getImageData(0, 0, hiddenCanvas.width, hiddenCanvas.height);
const pixels = imgData.data;
.q-color {
  color: black;
  margin-left: auto; 
}

let matchLines = 0; 
const scanYRows = [35, 40, 80, 85];
.key.enter {
  grid-row: span 2;
  height: 146px; 
  font-size: 14px;
}

let threshold = 50; 
.key-split {
  display: flex;
  gap: 4px;
}

for (let y of scanYRows) {
let changeCount = 0;
let lastBrightness = -1;
.key-split .key {
  flex: 1;
  height: 60px;
  font-size: 24px;
}

for (let x = 30; x < hiddenCanvas.width - 30; x += 2) {
const idx = (y * hiddenCanvas.width + x) * 4;
const brightness = (pixels[idx] + pixels[idx+1] + pixels[idx+2]) / 3;
.key.small {
  font-size: 24px;
}

if (lastBrightness !== -1) {
if (Math.abs(brightness - lastBrightness) > threshold) {
changeCount++;
.answer {
  margin: 25px 0;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 4px;
  
}
  .single-char-input {
            width: 1.5em !important;
            min-width: 1.5em !important;
            max-width: 1.5em !important;
            box-sizing: border-box;
            text-align: center;
            padding: 2px 0;
        }

        /* datalistの▼（矢印）を非表示にする（Chrome, Safari, Edge） */
        .single-char-input::-webkit-calendar-picker-indicator {
            display: none !important;
            -webkit-appearance: none !important;
        }
        
        /* Firefox用の矢印対策 */
        .single-char-input {
            -moz-appearance: textfield !important;
        }

input::placeholder {
  font-size: 20px; 
}
lastBrightness = brightness;


/* 入力欄（PCでもスマホでも50px固定） */
.answer input {
  width: 50px; 
  height: 50px;
  text-align: center;
  font-size: 28px;
}

if (changeCount >= 10 && changeCount <= 18) {
matchLines++;
.to {
  margin: 0 10px;
  font-size: 24px;
}

button {
  padding: 10px 20px;
  font-size: 16px;
}

if (matchLines >= 2) {
arImage.src = questData[currentStage].imageSrc;
isFound = true; 
showQuizUI();
/* 結果エリア */
.result-area {
  margin-top: 20px;
}
} catch (e) {}

// ガイド枠
if (!isFound) {
ctx.strokeStyle = "rgba(0, 255, 0, 0.5)";
ctx.lineWidth = 3;
ctx.beginPath();
ctx.moveTo(canvas.width * 0.15, canvas.height * 0.28);
ctx.lineTo(canvas.width * 0.85, canvas.height * 0.28);
ctx.moveTo(canvas.width * 0.15, canvas.height * 0.72);
ctx.lineTo(canvas.width * 0.85, canvas.height * 0.72);
ctx.stroke();

ctx.fillStyle = "#00FF00";
ctx.font = "bold 14px sans-serif";
ctx.textAlign = "center";
ctx.fillText("上下のシマシマを線に合わせてください", canvas.width / 2, canvas.height * 0.2);

#result {
  font-size: 22px;
  font-weight: bold;
  white-space: pre-wrap;
  margin: 0;
}

requestAnimationFrame(analyzeFrame);
#hintResult {
  font-size: 18px; 
  color: red; 
  font-weight: bold; 
  white-space: pre-wrap;
  margin: 5px 0 0 0;
}

// AR描画
function drawAR(x, y) {
ctx.save();

const currentX = x + offsetX;
const currentY = y + offsetY;
const imgWidth = 250 * imgScale;
const imgHeight = 250 * imgScale;

if (arImage.complete && arImage.naturalWidth !== 0) {
ctx.drawImage(arImage, currentX - (imgWidth / 2), currentY - (imgHeight / 2), imgWidth, imgHeight);
} else {
ctx.strokeStyle = "#00FF00";
ctx.lineWidth = 2;
ctx.strokeRect(currentX - (imgWidth / 2), currentY - (imgHeight / 2), imgWidth, imgHeight);
#timeResult {
  color: red;
  font-weight: bold;
  font-size: 20px;
  margin: 5px 0 0 0;
}

ctx.restore();
.correct { color: green; }
.wrong { color: red; }
</style>

<div id="quiz-wrapper" style="width:100%; overflow:hidden;">
  <div id="quiz">
    <div class="key Con">
      ヒント:CaとMgの量で決まる
      <span class="q-color">☺</span>
    </div>

    <!-- キーボード -->
    <div class="keyboard">
      <div class="key gray small"></div>
      <div class="key white">④</div>
      <div class="key white">⑤</div>
      <div class="key white">③</div>
      <div class="key gray">⌫</div>

      <div class="key gray small"></div>
      <div class="key white"></div>
      <div class="key white">①</div>
      <div class="key white"></div>
      <div class="key gray small">空白</div>

      <div class="key gray small"></div>
      <div class="key white">ま</div>
      <div class="key white">や</div>
      <div class="key white">ら</div>
      <div class="key gray enter small">改行</div>
    
      <div class="key-split">
        <div class="key gray"></div>
        <div class="key gray"></div>
      </div>
      <div class="key white small">^-^</div>
      <div class="key white">②</div>
      <div class="key white small">、。?!</div>
    </div>

    <p><strong><font size="5">答え</font></strong></p>

    <div class="answer">
      <input list="list1" maxlength="1" placeholder="①" class="single-char-input">
      <input list="list2" maxlength="1" placeholder="②上" class="single-char-input">
      <input list="list3" maxlength="1" placeholder="③上" class="single-char-input">
      <input list="list4" maxlength="1" placeholder="④左" class="single-char-input">

      <span class="to">と</span>

      <input list="list5" maxlength="1" placeholder="⑤下" class="single-char-input">
      <input list="list6" maxlength="1" placeholder="④上" class="single-char-input">
      <input list="list3" maxlength="1" placeholder="③上" class="single-char-input">
      <input list="list4" maxlength="1" placeholder="④左" class="single-char-input">
    </div>
<datalist id="list1">
	<option value="お"></option>
	<option value="き"></option>
	<option value="な"></option>
	<option value="わ"></option>
	<option value="こ"></option>
	<option value="き"></option>
	<option value="く"></option>
	<option value="が"></option>
	<option value="し"></option>
	<option value="ら"></option>
	<option value="こ"></option>
	<option value="う"></option>
	<option value="も"></option>
	<option value="り"></option></datalist>
<datalist id="list2">
	<option value="ぎ"></option>
	<option value="ょ"></option>
	<option value="く"></option>
	<option value="せ"></option>
	<option value="ん"></option>
	<option value="ど"></option>
	<option value="う"></option></datalist>
<datalist id="list3">
	<option value="ふ"></option>
	<option value="ろ"></option>
	<option value="ー"></option>
	<option value="す"></option>
	<option value="と"></option>
	<option value="ー"></option>
	<option value="ん"></option></datalist>
<datalist id="list4">
	<option value="せ"></option>
	<option value="っ"></option>
	<option value="か"></option>
	<option value="い"></option>
	<option value="が"></option>
	<option value="ん"></option></datalist>
<datalist id="list5">
	<option value="え"></option>
	<option value="こ"></option>
	<option value="ー"></option>
	<option value="ろ"></option>
	<option value="け"></option>
	<option value="ー"></option>
	<option value="し"></option>
	<option value="ょ"></option>
	<option value="ん"></option></datalist>
<datalist id="list6">
	<option value="ど"></option>
	<option value="う"></option>
	<option value="く"></option>
	<option value="つ"></option>
	<option value="し"></option>
	<option value="ん"></option>
	<option value="じ"></option>
	<option value="ゅ"></option></datalist>


    <button id="checkBtn" onclick="checkAnswer()">判定</button>
    <button id="retryBtn" onclick="retryQuiz()" style="display:none;">もう一度</button>

    <div class="result-area">
      <p id="result"></p>
      <p id="hintResult"></p>
      <p id="timeResult"></p>
    </div>
  </div>
</div>

<script>
// ★ PCとスマホで比率を全く同じに保ちつつ自動拡大縮小するシステム
function updateScale() {
  const quiz = document.getElementById("quiz");
  const wrapper = document.getElementById("quiz-wrapper");
  
  // 親要素（Googleサイトの枠）の横幅を取得
  const currentWidth = wrapper.getBoundingClientRect().width;
  
  // 基準値（500px）に対して、現在の幅がどれくらいかを計算
  let scale = currentWidth / 500;
  if (scale > 1) scale = 1; // PCなどで500px以上の時は拡大せず100%にする

  // 全体を縮小
  quiz.style.transform = `scale(${scale})`;
  
  // 縮小によって生じる親要素の余分な高さを補正
  const actualHeight = quiz.scrollHeight * scale + 20;
  wrapper.style.height = `${actualHeight}px`;

  // Googleサイトのiframe自体の高さを自動調整
  window.parent.postMessage({
    sentinel: 'amp',
    type: 'embed-size',
    height: actualHeight
  }, '*');
}

// クイズUI表示
function showQuizUI() {
if (currentStage >= questData.length) return;
// 各種イベントでサイズ更新を動かす
window.addEventListener("load", updateScale);
window.addEventListener("resize", updateScale);

const boxes = document.querySelectorAll(".answer input");

const stage = questData[currentStage];
let optionsHtml = '';
stage.options.forEach((opt, index) => {
optionsHtml += `<button class="option-btn" onclick="checkAnswer(${index})">${opt}</button>`;
boxes.forEach((box, index) => {
  box.addEventListener("input", () => {
    if (box.value && index < boxes.length - 1) {
      boxes[index + 1].focus();
    }
  });
});

uiContent.innerHTML = `
       <div class="quiz-text">📍 ${stage.location}</div>
       <div class="quiz-text">${stage.question}</div>
       <div class="options-container">${optionsHtml}</div>
   `;
quizUi.classList.add('show');
}
const startTime = Date.now();

// 答え合わせ
function checkAnswer(selectedIndex) {
const stage = questData[currentStage];
function checkAnswer() {
  const first = boxes[0].value + boxes[1].value + boxes[2].value + boxes[3].value;
  const second = boxes[4].value + boxes[5].value + boxes[6].value + boxes[7].value;

if (selectedIndex === stage.correctIndex) {
const isLast = currentStage === questData.length - 1;
const btnText = isLast ? "クエストクリア！" : "次のスポットへ移動する";
  const result = document.getElementById("result");
  const hintResult = document.getElementById("hintResult");
  const checkBtn = document.getElementById("checkBtn");
  const retryBtn = document.getElementById("retryBtn");

uiContent.innerHTML = `
           <div class="hint-text">${stage.hint}</div>
           <button class="next-btn" onclick="goToNextStage()">${btnText}</button>
       `;
} else {
alert("ザンネン！ちがうようだ。もう一度考えてみよう！");
}
}
  if (first === "なんすい" && second === "こうすい") {
    result.className = "correct";
    result.textContent = "正解！";
    hintResult.textContent = ""; 
    
    checkBtn.style.display = "none";
    retryBtn.style.display = "none";

// 次のステージへ進む（セーブ対応）
function goToNextStage() {
quizUi.classList.remove('show');
    const now = new Date(Date.now());
    const hours = now.getHours();
    const minutes = now.getMinutes();
    const seconds = now.getSeconds();

isFound = false;
offsetX = 0;
offsetY = 0;
imgScale = 1.0;
    document.getElementById("timeResult").textContent =
      "クリアタイム："+ hours + "時" + minutes + "分" + seconds + "秒";

currentStage++;
localStorage.setItem('cave_quest_stage', currentStage); // ステージ保存
  } else {
    result.className = "wrong";
    result.textContent = "不正解"; 
    hintResult.textContent = "ヒント2：水にも硬さがある？";

if (currentStage >= questData.length) {
alert("すべてのクエストが終了しました！");
}
}
    checkBtn.style.display = "none";
    retryBtn.style.display = "inline-block";
  }

// タッチ操作
let startX = 0, startY = 0;
window.addEventListener('touchstart', (e) => {
if (e.touches.length === 1) {
startX = e.touches[0].clientX;
startY = e.touches[0].clientY;
} else if (e.touches.length === 2) {
touchStartDist = Math.hypot(
e.touches[0].clientX - e.touches[1].clientX,
e.touches[0].clientY - e.touches[1].clientY
);
  updateScale();
}
});

window.addEventListener('touchmove', (e) => {
if (e.touches.length === 1) {
const moveX = e.touches[0].clientX - startX;
const moveY = e.touches[0].clientY - startY;
offsetX += moveX;
offsetY += moveY;
startX = e.touches[0].clientX;
startY = e.touches[0].clientY;
} else if (e.touches.length === 2) {
const dist = Math.hypot(
e.touches[0].clientX - e.touches[1].clientX,
e.touches[0].clientY - e.touches[1].clientY
);
imgScale *= (dist / touchStartDist);
touchStartDist = dist;
}
});
function retryQuiz() {
  const result = document.getElementById("result");
  const hintResult = document.getElementById("hintResult");
  const checkBtn = document.getElementById("checkBtn");
  const retryBtn = document.getElementById("retryBtn");

  result.textContent = "";

  boxes.forEach(box => {
    box.value = "";
  });

  retryBtn.style.display = "none";
  checkBtn.style.display = "inline-block";

  boxes[0].focus();

// ★【PWA対応】オフライン用の仕組み（Service Worker）を安全な位置に自動登録
if ('serviceWorker' in navigator) {
navigator.serviceWorker.register('sw.js')
.then(() => console.log('オフライン準備完了！'))
.catch((err) => console.log('登録エラー:', err));
  updateScale();
}
</script>
</body>
</html>
