<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>クエスト風：フラグ管理ARエンジン</title>
<style>
body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
#webcam, #ar-canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; }
#ar-canvas { z-index: 10; pointer-events: none; }

/* クイズ・ヒントを表示するUIエリア（画面下部にせり上がる） */
#quiz-ui {
    position: fixed;
    bottom: -100vh; /* 最初は画面の下に隠しておく */
    left: 0;
    width: 100vw;
    height: 40vh;
    background: rgba(0, 0, 0, 0.85);
    border-top: 3px solid #00FF00;
    border-radius: 20px 20px 0 0;
    z-index: 100;
    transition: bottom 0.4s ease;
    padding: 20px;
    box-sizing: border-box;
    color: #fff;
    text-align: center;
}
#quiz-ui.show { bottom: 0; } /* クラスがつくと画面内に出現 */

.quiz-text { font-size: 16px; font-weight: bold; margin-bottom: 15px; color: #00FF00; }
.hint-text { font-size: 16px; color: #FFF; font-weight: bold; line-height: 1.5; }

/* 3択の選択肢ボタン */
.options-container { display: flex; flex-direction: column; gap: 10px; }
.option-btn {
    background: #222;
    color: #fff;
    border: 1px solid #00FF00;
    padding: 10px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s;
}
.option-btn:active { background: #00FF00; color: #000; }

/* 次へ進むボタン */
.next-btn {
    background: #00FF00;
    color: #000;
    border: none;
    padding: 12px 30px;
    border-radius: 25px;
    font-size: 16px;
    font-weight: bold;
    margin-top: 15px;
    cursor: pointer;
}
</style>
</head>
<body>

<video id="webcam" autoplay playsinline muted></video>
<canvas id="ar-canvas"></canvas>

<!-- クエストUIエリア -->
<div id="quiz-ui">
    <div id="ui-content"></div>
</div>

<script>
const video = document.getElementById('webcam');
const canvas = document.getElementById('ar-canvas');
const ctx = canvas.getContext('2d');
const quizUi = document.getElementById('quiz-ui');
const uiContent = document.getElementById('ui-content');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ==========================================
// 【クエストのデータ定義】※ネットなしでも動くようにここに全データを持たせます
// ==========================================
let currentStage = 0; // 現在のステージ（0: A地点、1: B地点 ...）
let isShowingResult = false; // クイズに正解してヒントを表示しているかどうかのフラグ

const questData = [
    {
        location: "A地点",
        question: "【問題1】沖縄の方言で「ゴーヤー」の正式な和名は何でしょう？",
        options: ["ヘチマ", "ツルレイシ", "トウガン"],
        correctIndex: 1, // ツルレイシが正解
        hint: "正解！【B地点へのヒント】<br>次に向かうべき場所は、大きなガジュマルの木の下だ。そこで再びマーカーにかざせ！"
    },
    {
        location: "B地点",
        question: "【問題2】ゴーヤーのビタミンCは、レモンの約何倍含まれている？",
        options: ["約1.5倍", "約3倍", "約10倍"],
        correctIndex: 1, // 約3倍が正解
        hint: "素晴らしい！クエストクリア！<br>すべての謎が解けました。受付に戻って景品を受け取ろう！"
    }
];

// カメラの起動
navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
.then((stream) => {
    video.srcObject = stream;
    video.addEventListener('loadedmetadata', () => {
        requestAnimationFrame(analyzeFrame);
    });
})
.catch((err) => { alert("カメラ起動エラー: " + err.name); });

// グローバル変数
let isFound = false;
let savedX = 0;
let savedY = 0;
let imgScale = 1.0;
let offsetX = 0;
let offsetY = 0;
let touchStartDist = 0;

// 画像の読み込み
const arImage = new Image();
arImage.src = 'ごーやーフォトスポ.png'; 

// 画像解析ループ
function analyzeFrame() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (isFound) {
        drawAR(savedX, savedY);
        requestAnimationFrame(analyzeFrame);
        return; 
    }

    // スキャン処理
    const hiddenCanvas = document.createElement('canvas');
    hiddenCanvas.width = 160;
    hiddenCanvas.height = 120;
    const hCtx = hiddenCanvas.getContext('2d');
    hCtx.drawImage(video, 0, 0, hiddenCanvas.width, hiddenCanvas.height);

    try {
        const imgData = hCtx.getImageData(0, 0, hiddenCanvas.width, hiddenCanvas.height);
        const pixels = imgData.data;
        let corners = [];
        let threshold = 40;

        for (let y = 4; y < hiddenCanvas.height - 4; y += 3) {
            for (let x = 4; x < hiddenCanvas.width - 4; x += 3) {
                const idx = (y * hiddenCanvas.width + x) * 4;
                const current = (pixels[idx] + pixels[idx+1] + pixels[idx+2]) / 3;
                const idxRight = (y * hiddenCanvas.width + (x + 2)) * 4;
                const idxBottom = ((y + 2) * hiddenCanvas.width + x) * 4;
                const diffX = Math.abs(current - (pixels[idxRight] + pixels[idxRight+1] + pixels[idxRight+2]) / 3);
                const diffY = Math.abs(current - (pixels[idxBottom] + pixels[idxBottom+1] + pixels[idxBottom+2]) / 3);

                if (diffX > threshold && diffY > threshold) {
                    let isNew = true;
                    for (let c of corners) {
                        if (Math.abs(c.x - x) < 15 && Math.abs(c.y - y) < 15) {
                            isNew = false;
                            break;
                        }
                    }
                    if (isNew) corners.push({ x: x, y: y });
                }
            }
        }

        // 角が10個以上見つかったらマーカー（ロゴ）があると判定する！
            if (corners.length >= 10) {

            let totalX = 0, totalY = 0;
            for (let c of corners) {
                totalX += c.x;
                totalY += c.y;
            }
            savedX = (totalX / 4) * (canvas.width / hiddenCanvas.width);
            savedY = (totalY / 4) * (canvas.height / hiddenCanvas.height);
            isFound = true; 
            
            // マarkerを見つけたらUIを表示する
            showQuizUI();
        }
    } catch (e) {}

    requestAnimationFrame(analyzeFrame);
}

// AR画像描画（重複バグを修正）
function drawAR(x, y) {
    ctx.save();

    // 照準マーク
    ctx.strokeStyle = "#00FF00";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(x, y, 20, 0, Math.PI * 2);
    ctx.stroke();

    // 位置と大きさを計算
    const currentX = x + offsetX;
    const currentY = y - 40 + offsetY;
    const imgWidth = 200 * imgScale;
    const imgHeight = 200 * imgScale;

    // 画像描画（問題画像として出現）
    ctx.drawImage(arImage, currentX - (imgWidth / 2), currentY - (imgHeight / 2), imgWidth, imgHeight);

    ctx.restore();
}

// ==========================================
// 【クエストUI制御の処理】
// ==========================================
function showQuizUI() {
    if (currentStage >= questData.length) return;
    
    isShowingResult = false;
    const stage = questData[currentStage];
    
    // 3択ボタンを組み立てる
    let optionsHtml = '';
    stage.options.forEach((opt, index) => {
        optionsHtml += `<button class="option-btn" onclick="checkAnswer(${index})">${opt}</button>`;
    });

    uiContent.innerHTML = `
        <div class="quiz-text">📍 ${stage.location} に到達！</div>
        <div class="quiz-text">${stage.question}</div>
        <div class="options-container">${optionsHtml}</div>
    `;
    quizUi.classList.add('show');
}

// 答え合わせの関数
function checkAnswer(selectedIndex) {
    const stage = questData[currentStage];
    
    if (selectedIndex === stage.correctIndex) {
        // 正解ならB地点へのヒントを表示
        isShowingResult = true;
        
        // ラストステージかどうかでボタンの文字を変える
        const isLast = currentStage === questData.length - 1;
        const btnText = isLast ? "クリア！" : "次のスポットを探す";
        
        uiContent.innerHTML = `
            <div class="hint-text">${stage.hint}</div>
            <button class="next-btn" onclick="goToNextStage()">${btnText}</button>
        `;
    } else {
        alert("ザンネン！ちがうようだ。もう一度考えてみよう！");
    }
}

// 次のステージ（B地点など）へ進む処理
function goToNextStage() {
    quizUi.classList.remove('show');
    
    // フラグや位置移動の記憶をリセットして次のスキャンに備える
    isFound = false;
    offsetX = 0;
    offsetY = 0;
    imgScale = 1.0;
    
    currentStage++;
    
    if (currentStage >= questData.length) {
        alert("全クエスト完了です！お疲れ様でした！");
    }
}

// タッチ操作
let startX = 0, startY = 0;
window.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
    } else if (e.touches.length === 2) {
        touchStartDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
        );
    }
});

window.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1) {
        const moveX = e.touches[0].clientX - startX;
        const moveY = e.touches[0].clientY - startY;
        offsetX += moveX;
        offsetY += moveY;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
    } else if (e.touches.length === 2) {
        const dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
        );
        imgScale *= (dist / touchStartDist);
        touchStartDist = dist;
    }
});
</script>
</body>
</html>
