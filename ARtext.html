<style>
/* 
 ★全体の基準サイズを500pxに固定し、
 画面幅が500pxより狭いとき（スマホ）は
 その画面幅に合わせて綺麗に全体を縮小します。

#quiz {
  width: 500px; /* 基準の横幅を固定 */
margin: auto;
text-align: center;
font-family: sans-serif;
box-sizing: border-box;
padding: 10px;
overflow: hidden;
*/
/* 縮小の基準点を左上に設定 */
transform-origin: top left; 
}

/* すべての要素でサイズ計算を狂わせない設定 */
#quiz *, #quiz *::before, #quiz *::after {
box-sizing: border-box;
}

/* キーボードの外枠 */
.keyboard {
display: grid;
grid-template-columns: repeat(5, 1fr);
gap: 6px;
margin: 20px auto;
background: #e6e6fa; 
padding: 8px;
border-radius: 5px;
width: 100%; 
}

.key {
border-radius: 6px;
height: 70px;
display: flex;
align-items: center;
justify-content: center;
font-size: 16px;
pointer-events: none;
user-select: none;
box-shadow: 0 1px 1px rgba(0,0,0,0.2);
}

.key.white {
background: #ffffff;
color: #000000;
font-size: 28px; /* 元の大きさに固定 */
}

.key.gray {
background: #b0c4de;
color: #000000;
font-size: 24px; /* 元の大きさに固定 */
}

/* ヒント1の枠 */
.key.Con {
background: white;
justify-content: flex-start;
border: 1px solid #000000;
color: red;
width: 100%; 
height: 25px; /* 元の高さに固定 */
padding: 0 8px;
font-size: 14px;
}

.q-color {
color: black;
margin-left: auto; 
}

.key.enter {
grid-row: span 2;
height: 146px; 
font-size: 14px;
}

.key-split {
display: flex;
gap: 4px;
}

.key-split .key {
flex: 1;
height: 60px;
font-size: 24px;
}

.key.small {
font-size: 24px;
}

.answer {
margin: 25px 0;
display: flex;
justify-content: center;
align-items: center;
gap: 4px;

}
.single-char-input {
width: 1.5em !important;
min-width: 1.5em !important;
max-width: 1.5em !important;
box-sizing: border-box;
text-align: center;
padding: 2px 0;
}

/* datalistの▼（矢印）を非表示にする（Chrome, Safari, Edge） */
.single-char-input::-webkit-calendar-picker-indicator {
display: none !important;
-webkit-appearance: none !important;
}

/* Firefox用の矢印対策 */
.single-char-input {
-moz-appearance: textfield !important;
}

input::placeholder {
font-size: 20px; 
}


/* 入力欄（PCでもスマホでも50px固定） */
.answer input {
width: 50px; 
height: 50px;
text-align: center;
font-size: 28px;
}

.to {
margin: 0 10px;
font-size: 24px;
}

button {
padding: 10px 20px;
font-size: 16px;
}

/* 結果エリア */
.result-area {
margin-top: 20px;
}

#result {
font-size: 22px;
font-weight: bold;
white-space: pre-wrap;
margin: 0;
}

#hintResult {
font-size: 18px; 
color: red; 
font-weight: bold; 
white-space: pre-wrap;
margin: 5px 0 0 0;
}

#timeResult {
color: red;
font-weight: bold;
font-size: 20px;
margin: 5px 0 0 0;
}

.correct { color: green; }
.wrong { color: red; }
</style>

<script>
// ★ PCとスマホで比率を全く同じに保ちつつ自動拡大縮小するシステム
function updateScale() {
const quiz = document.getElementById("quiz");
const wrapper = document.getElementById("quiz-wrapper");

// 親要素（Googleサイトの枠）の横幅を取得
const currentWidth = wrapper.getBoundingClientRect().width;

// 基準値（500px）に対して、現在の幅がどれくらいかを計算
let scale = currentWidth / 500;
if (scale > 1) scale = 1; // PCなどで500px以上の時は拡大せず100%にする

// 全体を縮小
quiz.style.transform = `scale(${scale})`;

// 縮小によって生じる親要素の余分な高さを補正
const actualHeight = quiz.scrollHeight * scale + 20;
wrapper.style.height = `${actualHeight}px`;

// Googleサイトのiframe自体の高さを自動調整
window.parent.postMessage({
sentinel: 'amp',
type: 'embed-size',
height: actualHeight
}, '*');
}

// 各種イベントでサイズ更新を動かす
window.addEventListener("load", updateScale);
window.addEventListener("resize", updateScale);

const boxes = document.querySelectorAll(".answer input");

boxes.forEach((box, index) => {
box.addEventListener("input", () => {
if (box.value && index < boxes.length - 1) {
boxes[index + 1].focus();
}
});
});

const startTime = Date.now();

function checkAnswer() {
const first = boxes[0].value + boxes[1].value + boxes[2].value + boxes[3].value;
const second = boxes[4].value + boxes[5].value + boxes[6].value + boxes[7].value;

const result = document.getElementById("result");
const hintResult = document.getElementById("hintResult");
const checkBtn = document.getElementById("checkBtn");
const retryBtn = document.getElementById("retryBtn");

if (first === "なんすい" && second === "こうすい") {
result.className = "correct";
result.textContent = "正解！";
hintResult.textContent = ""; 

checkBtn.style.display = "none";
retryBtn.style.display = "none";

const now = new Date(Date.now());
const hours = now.getHours();
const minutes = now.getMinutes();
const seconds = now.getSeconds();

document.getElementById("timeResult").textContent =
"クリアタイム："+ hours + "時" + minutes + "分" + seconds + "秒";

} else {
result.className = "wrong";
result.textContent = "不正解"; 
hintResult.textContent = "ヒント2：水にも硬さがある？";

checkBtn.style.display = "none";
retryBtn.style.display = "inline-block";
}

updateScale();
}

function retryQuiz() {
const result = document.getElementById("result");
const hintResult = document.getElementById("hintResult");
const checkBtn = document.getElementById("checkBtn");
const retryBtn = document.getElementById("retryBtn");

result.textContent = "";

boxes.forEach(box => {
box.value = "";
});

retryBtn.style.display = "none";
checkBtn.style.display = "inline-block";

boxes[0].focus();

updateScale();
}
</script>
