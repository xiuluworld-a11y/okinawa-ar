<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>作戦C：完全自作OCR（文字認識）エンジン</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #webcam { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; }
        /* 画面中央に「文字を狙う枠」を表示 */
        #target-box {
            position: absolute; top: 50%; left: 50%; width: 120px; height: 120px;
            transform: translate(-50%, -50%); border: 4px dashed #00FF00; z-index: 10; pointer-events: none;
        }
        /* 認識した文字を表示する看板 */
        #result-label {
            position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: #FFF; padding: 15px 30px; font-size: 24px;
            font-weight: bold; border-radius: 10px; border: 2px solid #00FF00; z-index: 20; text-align: center;
        }
    </style>
    <!-- 完全無料の文字認識（OCR）プログラムを読み込む（事前アクセス時にスマホに記憶されます） -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <video id="webcam" autoplay playsinline muted></video>
    <div id="target-box"></div>
    <div id="result-label">緑の枠に文字を合わせてね</div>

    <script>
        const video = document.getElementById('webcam');
        const label = document.getElementById('result-label');

        // 1. スマホのカメラを起動（安全なHTTPS通信なので一瞬で映ります）
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
        .then((stream) => {
            video.srcObject = stream;
            video.addEventListener('loadedmetadata', () => {
                // 1.5秒ごとに文字を読み取るタイマーを発動（VBAのApplication.OnTimeのようなもの）
                setInterval(recognizeText, 1500);
            });
        })
        .catch((err) => { alert("カメラ起動エラー: " + err.name); });

        // 2. 文字認識を行う関数
        function recognizeText() {
            // 画面中央の「緑の枠」の中の映像だけを切り抜くための隠しキャンバス
            const cropCanvas = document.createElement('canvas');
            cropCanvas.width = 200;
            cropCanvas.height = 200;
            const ctx = cropCanvas.getContext('2d');

            // ビデオ映像の真ん中を切り抜いてキャンバスにコピー
            const videoWidth = video.videoWidth;
            const videoHeight = video.videoHeight;
            const startX = (videoWidth - 200) / 2;
            const startY = (videoHeight - 200) / 2;
            ctx.drawImage(video, startX, startY, 200, 200, 0, 0, 200, 200);

            label.innerText = "読み取り中...";

            // 【OCR心臓部】：切り抜いた画像をAIプログラムに引き渡して「答え合わせ」をさせる
            Tesseract.recognize(
                cropCanvas,
                'eng', // アルファベットを認識する英語モード（「C」などの文字を狙い撃ち）
                { logger: m => console.log(m) } // 進捗を裏でログ出力
            ).then(({ data: { text } }) => {
                // 前後の余計な空白をトリミング（VBAのTrim関数と同じ）
                const cleanedText = text.trim();
                
                if (cleanedText.length > 0) {
                    // 1文字だけを確実に狙うため、最初の1文字だけを切り出す（VBAのLeft関数と同じ）
                    const firstChar = cleanedText.charAt(0);
                    label.innerText = "認識成功！【 " + firstChar + " 】";
                } else {
                    label.innerText = "文字が見つかりません";
                }
            }).catch((err) => {
                label.innerText = "エラー発生";
            });
        }
    </script>
</body>
</html>
